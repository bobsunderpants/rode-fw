[package]
name = "rode-fw"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Dependency-free Rust reimplementation of the RODE Central firmware-update subsystem"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/rode-fw"
publish = false

[[bin]]
name = "rode-fw"
path = "src/main.rs"

[lib]
name = "rode_fw"
path = "src/lib.rs"

[dependencies]

[profile.release]
lto = true
codegen-units = 1
strip = true
